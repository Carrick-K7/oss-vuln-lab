[app]
runs_dir = ".ovl_runs"
corpus_dir = "corpus"
enabled_validators = ["docker_build", "sanitizer_runtime"]

[llm]
provider = "local"
base_url = ""
api_key_env = "OPENAI_API_KEY"
model = "local-heuristic"
temperature = 0.0
max_tokens = 1200
timeout_seconds = 30

[intel]
# Optional JSON web search endpoint used only by `impact ... --allow-network`.
# The URL may contain {query} and {limit} placeholders.
web_search_url = ""
web_search_api_key_env = "OVL_WEB_SEARCH_API_KEY"
timeout_seconds = 20
max_fetch_bytes = 1048576
