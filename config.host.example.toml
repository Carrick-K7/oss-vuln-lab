[app]
runs_dir = ".ovd_runs"
corpus_dir = "corpus"
# Explicit opt-in for host-side execution of target and replay commands.
enabled_validators = ["host_sanitizer_runtime", "direct_runtime"]

[llm]
provider = "local"
base_url = ""
api_key_env = "OPENAI_API_KEY"
model = "local-heuristic"
temperature = 0.0
max_tokens = 1200
timeout_seconds = 30
