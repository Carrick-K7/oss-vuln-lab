[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-vuln-lab"
version = "0.1.0"
description = "Local-first OSS vulnerability research lab"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
ovl = "oss_vuln_lab.cli:main"
ovd = "oss_vuln_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
